<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 设备数据库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); }
        .status-badge { padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-block; min-width: 50px; text-align: center; }
        .btn { transition: all 0.2s; border-radius: 8px; padding: 8px 16px; font-weight: 500; }
        .btn-active { background-color: #0071e3; color: white; }
        .btn-inactive { background-color: white; color: #1d1d1f; border: 1px solid #d2d2d7; }
        .btn-inactive:hover { background-color: #f5f5f7; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-semibold text-gray-900 mb-2">‎</h1>
            <h1 class="text-4xl font-semibold text-gray-900 mb-2">Apple 设备数据库</h1>
            <p class="text-gray-500">GeekBench 分数与系统生命周期全览 by 梨</p>
        </header>

        <!-- 操作栏 -->
        <div class="glass-card p-4 mb-6 flex flex-wrap gap-3 items-center justify-between">
            <div class="flex flex-wrap gap-2" id="filter-group">
                <button onclick="filterData('all')" class="btn btn-active" id="btn-all">全部</button>
                <button onclick="filterData('iPhone')" class="btn btn-inactive">iPhone</button>
                <button onclick="filterData('iPad')" class="btn btn-inactive">iPad</button>
                <button onclick="filterData('iPod')" class="btn btn-inactive">iPod</button>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="sortData('single')" class="btn btn-inactive bg-gray-100 text-sm">按单核排序 ↓</button>
                <button onclick="sortData('multi')" class="btn btn-inactive bg-gray-100 text-sm">按多核排序 ↓</button>
            </div>
        </div>

        <!-- 表格容器 -->
        <div class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600 whitespace-nowrap">产品线</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600 whitespace-nowrap">设备型号</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600 whitespace-nowrap text-center">状态</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600 whitespace-nowrap">发布时间</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600 whitespace-nowrap text-center">系统版本</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">CPU</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">单核</th>
                            <th class="px-6 py-4 text-sm font-semibold text-gray-600">多核</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- 数据渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        let displayData = [];

        async function loadData() {
            try {
                const response = await fetch('data.blob');
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        rawData = results.data;
                        displayData = [...rawData];
                        renderTable(displayData);
                    }
                });
            } catch (error) {
                console.error("加载 CSV 出错:", error);
            }
        }

        function getStatus(releaseDateStr) {
            if (!releaseDateStr) return { text: '-', class: '' };
            const [year, month] = releaseDateStr.split('.').map(Number);
            const releaseDate = new Date(year, (month || 1) - 1);
            const now = new Date();
            const diffYears = (now - releaseDate) / (1000 * 60 * 60 * 24 * 365.25);

            if (diffYears >= 7) {
                return { text: '停产', class: 'bg-red-100 text-red-600 border border-red-200' };
            } else if (diffYears >= 5) {
                return { text: '过时', class: 'bg-yellow-100 text-yellow-600 border border-yellow-200' };
            } else {
                return { text: '正常', class: 'bg-green-100 text-green-600 border border-green-200' };
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(item => {
                const status = getStatus(item["发布年月"]);
                const row = document.createElement('tr');
                row.className = "hover:bg-blue-50/50 transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${item["产品线"]}</td>
                    <td class="px-6 py-4 whitespace-nowrap font-bold text-gray-900">${item["设备型号"]}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">
                        <span class="status-badge ${status.class}">${status.text}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500">${item["发布年月"]}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center font-medium">
                        <span class="text-gray-400">iOS</span> ${item["首发系统"]} 
                        <span class="mx-1 text-gray-300">→</span> 
                        <span class="text-blue-600">${item["最高系统"]}</span>
                    </td>
                    <td class="px-6 py-4 text-gray-600">${item["CPU 型号"]}</td>
                    <td class="px-6 py-4 font-mono font-bold text-blue-600">${item["单核跑分"]}</td>
                    <td class="px-6 py-4 font-mono font-bold text-indigo-600">${item["多核跑分"]}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterData(type) {
            updateButtonStyles(type);
            displayData = (type === 'all') ? [...rawData] : rawData.filter(item => item["产品线"].toLowerCase().includes(type.toLowerCase()));
            renderTable(displayData);
        }

        function sortData(mode) {
            const key = mode === 'single' ? "单核跑分" : "多核跑分";
            displayData.sort((a, b) => (parseInt(b[key]) || 0) - (parseInt(a[key]) || 0));
            renderTable(displayData);
        }

        function updateButtonStyles(activeType) {
            const buttons = document.querySelectorAll('#filter-group .btn');
            buttons.forEach(btn => {
                const isMatch = (activeType === 'all' && btn.id === 'btn-all') || btn.innerText.includes(activeType);
                btn.className = isMatch ? 'btn btn-active' : 'btn btn-inactive';
            });
        }

        loadData();
    </script>
</body>
</html>
